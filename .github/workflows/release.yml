name: Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g. v1.0.0)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || github.inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    name: Build & Draft Release
    runs-on: ubuntu-latest

    steps:
      - name: Resolve target tag
        id: vars
        run: |
          TAG="${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.vars.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Package distribution archives
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          cd dist && zip -r "../postmatem-${TAG}.zip" . && cd ..
          tar -czf "postmatem-${TAG}.tar.gz" -C dist .

      - name: Create or Update Draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: PostMatem ${{ steps.vars.outputs.tag }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            postmatem-${{ steps.vars.outputs.tag }}.zip
            postmatem-${{ steps.vars.outputs.tag }}.tar.gz
